server {
    listen 6780 ssl;
    ssl_certificate /etc/letsencrypt/live/medinsight-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medinsight-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =308 https://124.70.96.183:6780$request_uri;
    server_name 124.70.96.183;
    client_max_body_size 25m;
    auth_basic "Dada Demo";
    auth_basic_user_file /etc/dada-6780/htpasswd;
    access_log /var/log/nginx/dada-6780-access.log;
    error_log /var/log/nginx/dada-6780-error.log;
    # Preset models are public source assets; the model loader uses credentials=omit.
    # Keep application pages and all private APIs behind their existing authentication.
    location ^~ /models/avatar/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:31680;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header X-Forward-Auth-Secret "";
        proxy_read_timeout 60s;
    }
    location /api/v1/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:31681;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header X-Forward-Auth-Secret "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:31680;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Remote-User $remote_user;
        proxy_set_header Remote-Email "${remote_user}@dada.demo";
        proxy_set_header Remote-Name $remote_user;
        proxy_set_header X-Forward-Auth-Secret REPLACE_WITH_PRIVATE_FORWARD_AUTH_SECRET;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
