# Dedicated frontend drop-in: pin the verified Collage Art UI requested by the owner.
# Install as /etc/systemd/system/dada-6780@frontend.service.d/20-submission-freeze.conf
# Remove this explicit pin only when intentionally updating the submission entry.
[Service]
WorkingDirectory=/opt/dada-6780/releases/20261018-latest-collage-r4/frontend
ExecStart=
ExecStart=/opt/node-v22.23.2-linux-x64/bin/node /opt/dada-6780/releases/20261018-latest-collage-r4/frontend/server.js
